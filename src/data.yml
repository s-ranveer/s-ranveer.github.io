about:
  eyebrow: About me
  title: Curiosity is the foundation of all learning.
  paragraphs:
    - I am Ranveer, a PhD student working with Dr Sriraam Natarajan in the Statistical Artificial Intelligence and Relational Learning Group (StARLinG Lab) at the University of Texas at Dallas.
    - I have called UT Dallas home since coming here for my undergraduate degree in Computer Science in Fall 2017, and I continued directly into the PhD program right after finishing my undergraduate degree.
    - As an undergraduate, I interned at a financial company in India, where I worked on statistical modelling tools for mutual fund investment.

research:
  eyebrow: Research
  title: Building AI for consequential domains.
  intro: My research currently involves large language models, probabilistic models, relational learning, reinforcement learning, and AI for healthcare. I investigate the use of LLMs for downstream tasks across clinical domains, ranging from relational information extraction from electronic health records to evaluating the role of LLMs in causal reasoning to solving relational multi-agent problems.
  focus:
    - title: Clinical AI with LLMs
      text: Exploring whether LLMs can serve as approximate knowledge sources to support learning in clinical settings, which are often data-poor and developing methods and frameworks for evaluating and mitigating hallucination and stochastic behavior in clinical decision-support tasks.
    - title: Relational reinforcement learning
      text: Studying multi-agent domains where states and actions are defined by objects and their relations, creating richer but exponentially larger problem spaces.

